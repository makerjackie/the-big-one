<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Big One</title>
<style>

  #frame:hover #bar { opacity: 1; }
  #bar::before { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(255,255,255,.25); }
  #fill { position: absolute; left: 0; bottom: 0; height: 4px; background: #ffd34d; width: 0; }

</style>
</head>
